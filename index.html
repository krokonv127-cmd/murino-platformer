<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Кубоплатформер</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: Arial, sans-serif; }
  canvas { display: block; cursor: default; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const playerImg = new Image();
playerImg.src = 'player.png';

let state = 'menu';
let coins = 0;
let hpUpgrades = 0;
let dmgUpgrades = 0;
let buttons = [];
let mouse = { x: -100, y: -100 };
let mouseAttack = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (state === 'menu') enterMenu();
  else if (state === 'shop') enterShop();
  else {
    buildPlatforms();
    if (player) { player.x = Math.min(player.x, worldW - player.w); player.y = Math.min(player.y, canvas.height - 60); }
    for (const e of enemies) { e.x = Math.min(e.x, worldW - e.w); e.y = Math.min(e.y, canvas.height - 60); }
  }
}
window.addEventListener('resize', resize);

canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
canvas.addEventListener('click', () => {
  for (const b of buttons) {
    if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) {
      b.action();
    }
  }
});
canvas.addEventListener('mousedown', e => { if (e.button === 0) mouseAttack = true; });
canvas.addEventListener('mouseup', e => { if (e.button === 0) mouseAttack = false; });
canvas.addEventListener('mouseleave', () => { mouseAttack = false; });

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && state === 'game') restart();
  if (e.code === 'KeyM' && state === 'game' && !player.alive) enterMenu();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const GRAVITY = 0.5;
const GROUND_H = 40;
const SAVE_KEY = 'kuboplasmor_save';

function saveGame() {
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    coins: coins,
    hpUpgrades: hpUpgrades,
    dmgUpgrades: dmgUpgrades,
    maxHp: player.maxHp,
  }));
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    coins = d.coins || 0;
    hpUpgrades = d.hpUpgrades || 0;
    dmgUpgrades = d.dmgUpgrades || 0;
    player.maxHp = d.maxHp || 500;
    player.hp = player.maxHp;
    player.damage = 10 * Math.pow(1.10, dmgUpgrades);
  } catch (e) { /* ignore */ }
}

let platforms = [];
let groundY = 0;
let worldW = 0;
let cam = { x: 0, y: 0 };

function buildPlatforms() {
  groundY = canvas.height - GROUND_H;
  worldW = canvas.width * 1.5;
  platforms = [{ x: 0, y: groundY, w: worldW, h: GROUND_H }];
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function clampEntity(e) {
  e.x = Math.max(0, Math.min(e.x, worldW - e.w));
}

function updateCamera() {
  const tx = player.x + player.w / 2 - canvas.width / 2;
  const ty = player.y + player.h / 2 - canvas.height * 0.55;
  cam.x += (tx - cam.x) * 0.08;
  cam.y += (ty - cam.y) * 0.08;
  const maxX = Math.max(0, worldW - canvas.width);
  cam.x = Math.max(0, Math.min(cam.x, maxX));
  const maxY = Math.max(0, groundY + GROUND_H - canvas.height);
  cam.y = Math.max(-canvas.height, Math.min(cam.y, maxY));
}

const player = {
  w: 64, h: 64,
  maxHp: 500, hp: 500,
  damage: 10,
  x: 0, y: 0, vx: 0, vy: 0,
  facing: 1,
  onGround: false,
  moveSpeed: 5,
  jumpSpeed: -14.5,
  attackTimer: 0,
  hitSet: new Set(),
  damageFlash: 0,
  charge: 0,
  chargedHit: false,
  alive: true,
};

function resetPlayer() {
  player.hp = player.maxHp;
  player.x = worldW * 0.45;
  player.y = groundY - player.h;
  player.vx = 0; player.vy = 0;
  player.facing = 1;
  player.onGround = false;
  player.attackTimer = 0;
  player.hitSet.clear();
  player.damageFlash = 0;
  player.charge = 0;
  player.chargedHit = false;
  player.alive = true;
}

let enemies = [];
let wave = 0;
let floatingTexts = [];
let effects = [];

function spawnEnemies() {
  wave++;
  for (let i = 0; i < 3; i++) {
    const side = Math.random() < 0.5 ? -1 : 1;
    enemies.push(makeEnemy(player.x + side * (220 + Math.random() * 120)));
  }
}

function makeEnemy(x) {
  return {
    w: 64, h: 64,
    hp: 100, maxHp: 100,
    x: x, y: groundY - 64,
    vx: 0, vy: 0,
    facing: 1,
    onGround: false,
    attackCd: Math.random() * 0.5,
    jumpCd: Math.random() * 1.5,
    speed: 1.7,
    hitFlash: 0,
    rewarded: false,
  };
}

function respawnCheck() {
  if (enemies.length === 0) spawnEnemies();
}

function addFloatingText(x, y, txt, color) {
  floatingTexts.push({ x, y, txt, color, life: 1 });
}

function makeButton(x, y, w, h, label, action) {
  return { x, y, w, h, label, action };
}

function enterMenu() {
  state = 'menu';
  const w = 260, h = 58;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  buttons = [
    makeButton(cx - w / 2, cy - 34, w, h, 'Куборубка', enterGame),
    makeButton(cx - w / 2, cy + 40, w, h, 'Магазин', enterShop),
  ];
}

function enterGame() {
  state = 'game';
  buttons = [];
  enemies = [];
  wave = 0;
  floatingTexts = [];
  buildPlatforms();
  cam.x = 0; cam.y = 0;
  resetPlayer();
  spawnEnemies();
  startCoins = coins;
}

function enterShop() {
  state = 'shop';
  const w = 340, h = 110;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2 - 20;
  buttons = [
    makeButton(cx - w / 2, cy - 125, w, h, 'Купить HP', buyHp),
    makeButton(cx - w / 2, cy + 15, w, h, 'Купить урон', buyDmg),
    makeButton(cx - 90, cy + 150, 180, 50, 'Назад', enterMenu),
  ];
}

function buyHp() {
  if (coins >= 10) {
    coins -= 10;
    hpUpgrades++;
    const add = Math.round(player.maxHp * 0.1);
    player.maxHp += add;
    player.hp += add;
    addFloatingText(canvas.width / 2, canvas.height / 2 + 60, '+10% HP', '#4ade80');
    saveGame();
  }
}

function buyDmg() {
  if (coins >= 10) {
    coins -= 10;
    dmgUpgrades++;
    player.damage = 10 * Math.pow(1.10, dmgUpgrades);
    addFloatingText(canvas.width / 2, canvas.height / 2 + 60, '+10% урон', '#fbbf24');
    saveGame();
  }
}

function playerUpdate() {
  if (!player.alive) return;

  if (player.charge < 100) player.charge = Math.min(100, player.charge + 25 / 60);
  player.damageFlash -= 1 / 60;
  if (player.attackTimer > 0) player.attackTimer -= 1 / 60;

  player.vx = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) { player.vx = -player.moveSpeed; player.facing = -1; }
  else if (keys['KeyD'] || keys['ArrowRight']) { player.vx = player.moveSpeed; player.facing = 1; }

  if ((keys['KeyW'] || keys['Space']) && player.onGround) {
    player.vy = player.jumpSpeed;
    player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;
  clampEntity(player);

  player.onGround = false;
  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vy >= 0 && player.y + player.h - player.vy <= p.y + 4) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  if (keys['KeyJ'] || keys['KeyF'] || mouseAttack) {
    if (player.attackTimer <= 0) {
      if (player.charge >= 100) {
        player.charge = 0;
        player.chargedHit = true;
        player.attackTimer = 0.35;
        player.hitSet = new Set();
        effects.push({ x: player.x + player.w / 2, y: player.y + player.h / 2, life: 0.6, maxR: 190, color: '#fbbf24' });
        addFloatingText(player.x + player.w / 2, player.y - 10, 'ЗАРЯД!', '#fbbf24');
      } else if (player.charge >= 25) {
        player.charge -= 25;
        player.chargedHit = false;
        player.attackTimer = 0.18;
        player.hitSet = new Set();
      }
    }
  }

  if (player.attackTimer > 0) {
    const range = player.chargedHit ? 150 : 84;
    const dmg = player.chargedHit ? player.damage * 3 : player.damage;
    const hb = {
      x: player.facing > 0 ? player.x + player.w - 14 : player.x - range + 14,
      y: player.y + 6,
      w: range,
      h: player.h - 12,
    };
    for (const e of enemies) {
      if (!player.hitSet.has(e) && rectsOverlap(hb, e)) {
        player.hitSet.add(e);
        e.hp -= dmg;
        e.hitFlash = 0.15;
        e.vx = player.facing * (player.chargedHit ? 7 : 3);
        addFloatingText(e.x + e.w / 2, e.y - 6, Math.round(dmg), player.chargedHit ? '#fbbf24' : '#ffd166');
      }
    }
  }
}

function enemyUpdate(e) {
  e.attackCd -= 1 / 60;
  e.jumpCd -= 1 / 60;
  e.hitFlash -= 1 / 60;
  e.vx *= 0.92;

  const dx = player.x - e.x;
  const dy = player.y - e.y;
  const dax = Math.abs(dx);

  if (dax > 40) {
    e.vx = Math.sign(dx) * e.speed;
    e.facing = Math.sign(dx);
  } else {
    e.vx = 0;
  }

  if (dy < -30 && dax < 200 && e.onGround && e.jumpCd <= 0) {
    e.vy = -11;
    e.onGround = false;
    e.jumpCd = 1.2 + Math.random() * 1;
  }

  e.vy += GRAVITY;
  e.x += e.vx;
  e.y += e.vy;
  clampEntity(e);

  e.onGround = false;
  for (const p of platforms) {
    if (rectsOverlap(e, p)) {
      if (e.vy >= 0 && e.y + e.h - e.vy <= p.y + 4) {
        e.y = p.y - e.h;
        e.vy = 0;
        e.onGround = true;
      } else if (e.vy < 0) {
        e.y = p.y + p.h;
        e.vy = 0;
      }
    }
  }

  if (player.alive && dax < 80 && Math.abs(dy) < 70 && e.attackCd <= 0) {
    e.attackCd = 1.0;
    player.hp -= 5;
    player.damageFlash = 0.3;
    addFloatingText(player.x + player.w / 2, player.y - 6, '-5', '#fca5a5');
    if (player.hp <= 0) {
      player.hp = 0;
      player.alive = false;
    }
  }
}

function update() {
  respawnCheck();
  playerUpdate();
  for (const e of enemies) enemyUpdate(e);
  enemies = enemies.filter(e => {
    if (e.hp <= 0) {
      if (!e.rewarded) {
        e.rewarded = true;
        coins++;
        addFloatingText(e.x + e.w / 2, e.y - 26, '+1 монета', '#ffd166');
        saveGame();
      }
      return false;
    }
    return true;
  });
  respawnCheck();
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#1a1a3e');
  grad.addColorStop(1, '#2d2d55');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawButton(b) {
  const hover = mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h;
  ctx.fillStyle = hover ? '#4a4a8f' : '#333365';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = hover ? '#9a9af0' : '#5a5a9a';
  ctx.lineWidth = 2;
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  if (b.disabled) ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

function drawCoinCounter(x, y) {
  const w = 150, h = 32;
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(x, y, h - 6, h - 6);
  ctx.strokeStyle = '#b45309';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, h - 6, h - 6);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(coins, x + h - 6 + 8, y + 23);
}

function renderMenu() {
  drawBackground();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 54px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('КУБОПЛАТФОРМЕР', canvas.width / 2, 130);

  ctx.fillStyle = '#a5b4fc';
  ctx.font = '20px Arial';
  ctx.fillText('Уничтожай серые кубы, собирай монеты и прокачивайся', canvas.width / 2, 165);

  drawCoinCounter(canvas.width / 2 - 75, 200);
  for (const b of buttons) drawButton(b);
}

function drawShopCard(x, y, w, h, title, price, desc, affordable) {
  const hover = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  ctx.fillStyle = (affordable ? (hover ? '#4a4a8f' : '#333365') : '#26264a');
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = affordable ? (hover ? '#9a9af0' : '#5a5a9a') : '#3a3a63';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  ctx.textAlign = 'center';
  ctx.fillStyle = affordable ? '#fff' : '#888';
  ctx.font = 'bold 24px Arial';
  ctx.fillText(title, x + w / 2, y + 34);
  ctx.fillStyle = affordable ? '#fbbf24' : '#777';
  ctx.font = 'bold 18px Arial';
  ctx.fillText(price, x + w / 2, y + 64);
  ctx.fillStyle = affordable ? '#c7d2fe' : '#666';
  ctx.font = '15px Arial';
  ctx.fillText(desc, x + w / 2, y + 92);
}

function renderShop() {
  drawBackground();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('МАГАЗИН', canvas.width / 2, 90);
  drawCoinCounter(canvas.width / 2 - 75, 120);

  const w = 340, h = 110;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2 - 20;
  const affordable = coins >= 10;

  drawShopCard(cx - w / 2, cy - 125, w, h, 'HP +10%', '10 монет', 'Максимум HP: ' + player.maxHp + '   ·   Куплено: ' + hpUpgrades, affordable);
  drawShopCard(cx - w / 2, cy + 15, w, h, 'Урон +10%', '10 монет', 'Урон за удар: ' + Math.round(player.damage * 10) / 10 + '   ·   Куплено: ' + dmgUpgrades, affordable);

  drawButton(buttons[2]);

  ctx.fillStyle = '#a5b4fc';
  ctx.font = '15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('За каждого убитого куба дают 1 монету', canvas.width / 2, canvas.height - 20);

  for (const ft of floatingTexts) {
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = 'bold 14px Arial';
    ctx.fillStyle = ft.color;
    ctx.textAlign = 'center';
    ctx.fillText(ft.txt, ft.x, ft.y);
    ctx.globalAlpha = 1;
    ft.y -= 1.2;
    ft.life -= 1 / 40;
  }
  floatingTexts = floatingTexts.filter(f => f.life > 0);
}

function renderGame() {
  drawBackground();
  drawWorldGrid();

  for (const p of platforms) {
    const px = p.x - cam.x;
    const py = p.y - cam.y;
    ctx.fillStyle = '#7c6df0';
    ctx.fillRect(px, py, p.w, p.h);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(px, py, p.w, 5);
  }

  for (const e of enemies) {
    const ex = e.x - cam.x;
    const ey = e.y - cam.y;
    let color = e.hitFlash > 0 ? '#ffffff' : '#9ca3af';
    ctx.fillStyle = color;
    ctx.fillRect(ex, ey, e.w, e.h);
    ctx.strokeStyle = '#4b5563';
    ctx.lineWidth = 2;
    ctx.strokeRect(ex, ey, e.w, e.h);

    const barW = e.w + 6;
    const barH = 6;
    const bx = ex - 3;
    const by = ey - 12;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(bx, by, barW * Math.max(0, e.hp / e.maxHp), barH);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, barW, barH);
  }

  if (player.alive) {
    const px = player.x - cam.x;
    const py = player.y - cam.y;
    if (playerImg.complete && playerImg.naturalWidth > 0) {
      ctx.drawImage(playerImg, px, py, player.w, player.h);
      if (player.damageFlash > 0) {
        ctx.fillStyle = 'rgba(220,38,38,0.45)';
        ctx.fillRect(px, py, player.w, player.h);
      }
    } else {
      let pcolor = player.damageFlash > 0 ? '#dc2626' : '#4ade80';
      if (player.attackTimer > 0) pcolor = '#86efac';
      ctx.fillStyle = pcolor;
      ctx.fillRect(px, py, player.w, player.h);
      ctx.strokeStyle = '#166534';
      ctx.lineWidth = 2;
      ctx.strokeRect(px, py, player.w, player.h);
    }

    if (player.attackTimer > 0) {
      const range = 84;
      const ax = (player.facing > 0 ? player.x + player.w : player.x - range) - cam.x;
      const ay = player.y + 6 - cam.y;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(ax, ay, range, player.h - 12);
    }
  }

  for (const fx of effects) {
    fx.life -= 1 / 60;
    const p = 1 - Math.max(0, fx.life) / 0.6;
    const rr = fx.maxR * p;
    ctx.globalAlpha = Math.max(0, Math.min(1, fx.life * 1.6));
    ctx.strokeStyle = fx.color;
    ctx.lineWidth = Math.max(1, 8 * fx.life);
    ctx.beginPath();
    ctx.arc(fx.x - cam.x, fx.y - cam.y, rr, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  effects = effects.filter(f => f.life > 0);

  for (const ft of floatingTexts) {
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.font = 'bold 14px Arial';
    ctx.fillStyle = ft.color;
    ctx.textAlign = 'center';
    ctx.fillText(ft.txt, ft.x - cam.x, ft.y - cam.y);
    ctx.globalAlpha = 1;
    ft.y -= 1.2;
    ft.life -= 1 / 40;
  }
  floatingTexts = floatingTexts.filter(f => f.life > 0);

  drawUI();
}

function drawWorldGrid() {
  const step = 80;
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  const ox = -(cam.x % step);
  for (let x = ox; x < canvas.width; x += step) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  const oy = -(cam.y % step);
  for (let y = oy; y < canvas.height; y += step) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawUI() {
  const bw = 220;
  const bh = 18;
  const bx = 16;
  const by = 16;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(bx - 4, by - 4, bw + 8, bh + 8);
  ctx.fillStyle = '#333';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#4ade80';
  ctx.fillRect(bx, by, bw * Math.max(0, player.hp / player.maxHp), bh);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('HP ' + Math.max(0, Math.round(player.hp)) + '/' + player.maxHp, bx + 8, by + 14);

  drawCoinCounter(16, 44);

  drawChargeCircle();

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Волна ' + wave + '   ·   Враги: ' + enemies.length, canvas.width / 2, 30);

  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '13px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('A/D — движение, W — прыжок, ЛКМ — удар, R — начать заново', canvas.width / 2, canvas.height - 8);
}

function drawChargeCircle() {
  const cx = 70;
  const cy = 165;
  const r = 46;
  const pct = Math.min(1, player.charge / 100);

  ctx.fillStyle = 'rgba(10,10,25,0.55)';
  ctx.beginPath();
  ctx.arc(cx, cy, r + 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.lineWidth = 9;
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  const full = pct >= 1;
  ctx.strokeStyle = full ? '#fbbf24' : '#60a5fa';
  ctx.lineCap = 'round';
  ctx.beginPath();
  const start = -Math.PI / 2;
  const end = start + Math.PI * 2 * Math.min(0.9999, pct);
  ctx.arc(cx, cy, r, start, end);
  ctx.stroke();
  ctx.lineCap = 'butt';

  ctx.fillStyle = full ? '#fbbf24' : '#93c5fd';
  ctx.font = 'bold 32px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const level = Math.floor(pct * 4);
  const label = full ? 'C' : (level >= 1 ? String(level) : '');
  if (label) ctx.fillText(label, cx, cy + 2);
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '11px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('ЗАРЯД', cx - 18, cy + r + 24);
}

function gameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f87171';
  ctx.font = 'bold 46px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('ПОРАЖЕНИЕ', canvas.width / 2, canvas.height / 2 - 10);
  ctx.fillStyle = '#fff';
  ctx.font = '20px Arial';
  ctx.fillText('Вы продержались до волны ' + wave, canvas.width / 2, canvas.height / 2 + 30);
  ctx.fillText('Собрано монет за игру: ' + (coins - startCoins), canvas.width / 2, canvas.height / 2 + 60);
  ctx.fillText('Нажмите R для новой игры', canvas.width / 2, canvas.height / 2 + 90);
  ctx.fillText('Нажмите M чтобы вернуться в меню', canvas.width / 2, canvas.height / 2 + 116);
}

let startCoins = 0;

function restart() {
  enemies = [];
  wave = 0;
  floatingTexts = [];
  buildPlatforms();
  cam.x = 0; cam.y = 0;
  resetPlayer();
  spawnEnemies();
  startCoins = coins;
}

function updateState() {
  if (state === 'game') {
    update();
    updateCamera();
    renderGame();
    if (!player.alive) gameOver();
  } else if (state === 'menu') {
    renderMenu();
  } else if (state === 'shop') {
    renderShop();
  }
}

function loop() {
  updateState();
  requestAnimationFrame(loop);
}

resize();
loadGame();
enterMenu();
startCoins = coins;
loop();
</script>
</body>
</html>
